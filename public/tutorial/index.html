<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zombuild V02a</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#141210;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f3ead8;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .pill{position:absolute;background:#1d1813e6;border:2px solid #3a3025;border-radius:14px;padding:8px 12px;font-weight:800;letter-spacing:.02em}
  #pile{top:12px;left:12px;display:flex;align-items:center;gap:8px;font-size:20px}
  #pile b{font-size:26px;color:#e8c37a;min-width:1.4em;display:inline-block;transition:transform .15s}
  #pile b.bump{transform:scale(1.5)}
  #hpwrap{top:12px;right:12px;width:min(42vw,220px)}
  #hpwrap small{display:block;font-size:11px;opacity:.7;margin-bottom:4px}
  #hpbar{height:12px;border-radius:6px;background:#3a1d18;overflow:hidden}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#c9432d,#e6763f);transition:width .12s}
  #hint{left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;font-weight:600;opacity:.85;text-align:center;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #tut{top:64px;left:50%;transform:translateX(-50%);text-align:center;min-width:min(78vw,340px);max-width:92vw;padding:8px 14px;border-color:#e8c37a88}
  #tut small{display:block;font-size:11px;letter-spacing:.12em;color:#e8c37a;opacity:.9}
  #tut span{display:block;font-size:16px;margin-top:2px}
  #tut i{display:block;font-style:normal;font-weight:600;font-size:12px;opacity:.75;margin-top:3px}
  #tut.done{border-color:#8fd16a}
  #btns{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
  #btns button{font:800 15px system-ui;background:#1d1813e6;color:#f3ead8;border:2px solid #3a3025;border-radius:12px;padding:7px 12px;cursor:pointer}
  #objPct{position:absolute;font-weight:900;font-size:13px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;transform:translate(-50%,-100%);display:none;pointer-events:none}
  #pct{position:absolute;font-weight:900;font-size:14px;color:#ffd6c4;text-shadow:0 2px 0 #000,0 0 6px #000;transform:translate(-50%,-100%);display:none}
  #cap{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:3;display:none;padding:10px 22px;border-radius:12px;background:#000a;color:#f3e6c4;font-size:24px;font-weight:900;text-align:center;text-shadow:0 2px 0 #000;max-width:90vw}
  #wCancel{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:3;display:none;padding:10px 18px;border-radius:12px;border:2px solid #e0583a;background:#2a1c10e6;color:#ffb39e;font-weight:900;font-size:16px;cursor:pointer}
  #stagesRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:10px;border-top:1px solid #3a3025;align-items:center}
  #stagesRow small{color:#b9a27a;font-weight:800;letter-spacing:.08em;margin-right:4px}
  #help #stagesRow button{font-size:13px;padding:6px 10px}
  #help #stagesRow button.cur{border-color:#e8c37a;color:#e8c37a}
  #skip{position:fixed;right:16px;bottom:16px;z-index:3;display:none;padding:10px 18px;border-radius:10px;border:2px solid #e8c37a;background:#2a1c10dd;color:#e8c37a;font-weight:900;font-size:16px;cursor:pointer}
  #settings{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:6;padding:18px;box-sizing:border-box}
  #settings .card{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;box-sizing:border-box;background:#1d1813;border:3px solid #e8c37a;border-radius:18px;padding:18px 20px;max-width:460px;width:100%;box-shadow:0 10px 0 #0008;color:#f3ead8}
  #settings h2{margin:0 0 6px;color:#e8c37a;font-size:22px} #settings h3{margin:8px 0 4px;font-size:13px;letter-spacing:.12em;color:#b9a27a;text-transform:uppercase}
  #settings .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #3a3025}
  #settings .row span{flex:1;display:flex;flex-direction:column} #settings .row b{color:#ffe08a;font-size:15px} #settings .row i{font-style:normal;font-size:12.5px;color:#b9ad97;margin-top:2px}
  #settings input[type=range]{width:120px;accent-color:#e8c37a} #settings input[type=checkbox]{width:22px;height:22px;accent-color:#e8c37a}
  #settings select{font:700 14px system-ui;background:#2a221a;color:#f3ead8;border:2px solid #3a3025;border-radius:10px;padding:6px 8px}
  #settings em{font-style:normal;width:34px;text-align:right;font-weight:800;color:#e8c37a}
  #settings .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  #settings button{font:800 16px system-ui;padding:10px 16px;border-radius:12px;border:2px solid #3a3025;background:#2a221a;color:#f3ead8;cursor:pointer}
  #settings button.primary{background:#e8c37a;color:#1b140c;border-color:#000}
  #paused{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0008;z-index:4;font-size:40px;font-weight:900;letter-spacing:.1em;color:#e8c37a;text-shadow:0 4px 0 #000;pointer-events:none}
  #paused small{font-size:14px;letter-spacing:.05em;color:#f3ead8;margin-top:8px}
  #sprint{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);font-weight:900;font-size:14px;letter-spacing:.1em;color:#ffe08a;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .2s}
  #map{position:absolute;top:84px;right:12px;width:132px;height:132px;border-radius:50%;box-shadow:0 3px 0 #0006}
  #help{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:6;padding:18px;box-sizing:border-box}
  #help .card{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;box-sizing:border-box;background:#1d1813;border:3px solid #e8c37a;border-radius:18px;padding:18px 20px;max-width:440px;width:100%;box-shadow:0 10px 0 #0008}
  #help h2{margin:0 0 10px;color:#e8c37a;font-size:22px}
  #help ul{list-style:none;margin:0;padding:0}
  #help li{display:flex;gap:12px;padding:8px 0;border-top:1px solid #3a3025;font-size:15px;line-height:1.35}
  #help li b{min-width:76px;color:#ffe08a}
  #help p{font-size:15px;line-height:1.45;margin:0}
  #help .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  #help button{font:800 16px system-ui;padding:10px 16px;border-radius:12px;border:2px solid #3a3025;background:#2a221a;color:#f3ead8;cursor:pointer}
  #help button.primary{background:#e8c37a;color:#1b140c;border-color:#000}
  #toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-size:26px;font-weight:900;text-shadow:0 3px 0 #000,0 0 18px #000;opacity:0;transition:opacity .25s;white-space:nowrap}
  #hurt{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px #b0141400;transition:box-shadow .2s}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#2a2119,#0d0b09);z-index:5;text-align:center;padding:24px;box-sizing:border-box}
  #overlay h1{margin:0 0 6px;font-size:44px;letter-spacing:.06em;color:#e8c37a;text-shadow:0 4px 0 #000}
  #overlay p{margin:6px 0;opacity:.85;max-width:420px;line-height:1.4}
  #go{margin-top:18px;padding:14px 30px;font-size:20px;font-weight:900;border-radius:14px;border:3px solid #000;background:#e8c37a;color:#1b140c;cursor:pointer}
  #go:disabled{opacity:.5}
  @media (max-width:520px){ #btns{top:58px} #tut{top:104px} #map{top:auto;bottom:52px;right:10px;width:104px;height:104px} #pile{font-size:15px;padding:6px 10px} #pile b{font-size:20px} #hpwrap{width:34vw;padding:6px 10px} #hint{font-size:11px;bottom:10px} #toast{font-size:20px} }
  .stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid #ffffff40;background:#00000030;display:none;pointer-events:none}
  .stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffffff55}
  #stickR{border-color:#ff9a6a70}
  #stickR i{background:#ff9a6a88}
</style>
</head>
<body>
<div id="hud">
  <div id="pile" class="pill">🦴 Corpses <b id="pileN">0</b></div>
  <div id="hpwrap" class="pill"><small>YOU</small><div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="hint" class="pill"></div>
  <div id="btns"><button id="bHelp" title="Instructions">?</button><button id="bPause" title="Pause (P)">❚❚ P</button><button id="bReset" title="Restart the tutorial">↺ Reset</button><button id="bSet" title="Settings">⚙</button></div>
  <div id="tut" class="pill"><small>TUTORIAL 1/6</small><span></span><i></i></div>
  <canvas id="map" width="240" height="240"></canvas>
  <div id="pct"></div><div id="objPct"></div>
  <div id="sprint">SPRINT +20%</div>
  <div id="toast"></div>
  <div id="cap"></div><button id="skip">Skip ▶</button><button id="wCancel">✕ Cancel wire</button>
  <div id="hurt"></div>
</div>
<div id="help"><div class="card"><h2></h2><ul></ul><div class="btns"></div></div></div>
<div id="settings"><div class="card"><h2>Settings</h2>
  <h3>Aiming</h3>
  <label class="row tog"><span><b>Camera turns with you</b><i>The view swivels so where you face is always up the screen</i></span><input type="checkbox" id="sFollow"></label>
  <label class="row"><span><b>Turn speed</b><i>How fast the right thumb (or ← →) turns you</i></span><input type="range" id="sTurn" min="0" max="100"><em id="vTurn"></em></label>
  <label class="row"><span><b>Camera smoothing</b><i>Low: the view locks to your aim. High: it glides after it</i></span><input type="range" id="sCam" min="0" max="100"><em id="vCam"></em></label>
  <label class="row"><span><b>Cone catch-up</b><i>How quickly the aim cone swings onto the aim line</i></span><input type="range" id="sCone" min="0" max="100"><em id="vCone"></em></label>
  <h3>Building</h3>
  <label class="row"><span><b>Wire placement</b><i>How you choose where a 3-square coil goes</i></span><select id="sPlace"><option value="aim">B · Aim it (default)</option><option value="walk">A · Walk it out</option><option value="tap">C · Tap the end</option></select></label>
  <h3>Free play</h3>
  <label class="row"><span><b>Difficulty</b><i>Easy: smaller, slower waves and more grazing rats. Hard: big waves that can overrun the town</i></span><select id="sDiff"><option value="easy">Easy (default)</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
  <h3>Camera</h3>
  <label class="row"><span><b>Camera lag</b><i>0: you always stay in the middle of the screen. Higher: the camera trails behind as you run</i></span><input type="range" id="sLag" min="0" max="100"><em id="vLag"></em></label>
  <div class="btns"><button id="sReset">Defaults</button><button class="primary" id="sDone">Done</button></div></div></div>
<div id="paused">PAUSED<small>Press P or tap ❚❚ to resume</small></div>
<div class="stick" id="stickL"><i></i></div>
<div class="stick" id="stickR"><i></i></div>
<div id="overlay">
  <h1>ZOMBUILD</h1>
  <p><b>Tutorial.</b> Learn the town's jobs one stage at a time. Stage 1: collecting bodies.</p>
  <p id="ctrl"></p>
  <button id="go" disabled>Loading…</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {mergeGeometries, deinterleaveGeometry} from 'three/addons/utils/BufferGeometryUtils.js';
import {OutlineEffect} from 'three/addons/effects/OutlineEffect.js';

// ---------- tuning ----------
const T = {
  speed: 4.4, carrySpeed: 2.2, turn: 12,
  // crossbow: auto-fires at a rat inside the cone. The cone narrows while standing still
  // (better accuracy) and widens when moving. Each bolt flies at the target plus a random
  // error up to the cone's half-angle, so a wide cone misses more.
  reload: 0.75, boltSpeed: 30, range: 13, boltDmg: 1,
  coneMax: 30, coneMin: 5, coneNarrow: 1.1, coneWiden: 0.18, aimTurnMax: 5, aimEase: 7, aimKeyRate: 1.9, touchAimEase: 9, touchSens: 0.8,
  // sprint: +20% when running with the aim line pointing the way you travel and not shooting
  sprint: 1.2, sprintAngle: 25, strafeAngle: 60,
  // rats: 75% slower than V02a's first cut
  ratHp: 10, ratWalk: 0.9, ratRun: 2.0, ratChase: 15, ratBite: 9, ratReach: 0.8,
  firstSpawn: 2.5, spawnEvery: 9, maxRats: 4, spawnDist: 16,
  pickTime: 0.75, dropTime: 0.5, pickRange: 1.6,
  hp: 100, regenDelay: 3, regen: 6, respawn: 3,
};
const BOUNDS = {x0:-17, x1:17, z0:-70, z1:34};   // the field runs far north for outposts
// Town (layout v2): a 20 x 20 m bone-fenced square, 3 x 3 cells, roads between cells, 8 gates on the roads.
const TOWN = {x0:-10, x1:10, z0:10, z1:30};
// Layout flipped north-south 17 Nov: corpse pile and entrance on the north side (towards the rats), trays on the south side
const CX = [-6.7, 0, 6.7], CZ = [26.7, 20, 13.3], ROADS = [-3.35, 3.35], ROADZ = [16.65, 23.35];
const PILE = new THREE.Vector3(-6.7, 0, 13.3), PILE_HALF = 1.75;
const TENT = new THREE.Vector3(6.7, 0, 13.3);
const FACTORY = new THREE.Vector3(0, 0, 20);
const GUNTRAY = new THREE.Vector3(6.7, 0, 20);
const GATE = new THREE.Vector3(0, 0, 10);

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
document.getElementById('ctrl').innerHTML = isTouch
  ? 'Left thumb: move. Right thumb: aim and fire.<br>Stand still on a body to pick it up.'
  : 'WASD: move. Right-click or ← →: aim. Firing is automatic.<br>Stand still on a body to pick it up. Q drops it. Space: crossbow away / out.';
const hintEl = document.getElementById('hint');
const setHint = t => { if (hintEl.textContent !== t) hintEl.textContent = t; };

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
const LITE = new URLSearchParams(location.search).get('mode') === 'play' && (matchMedia('(pointer:coarse)').matches || innerWidth < 900);
renderer.setPixelRatio(LITE ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !LITE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const effect = new OutlineEffect(renderer, {defaultThickness:0.006, defaultColor:[0.05,0.03,0.02]});

const scene = new THREE.Scene();
// ground theme: 'snow' (default) or 'mud' (?ground=mud); swappable later per map or season
const THEME = new URLSearchParams(location.search).get('ground') === 'mud' ? 'mud' : 'snow';
const SKY = THEME === 'snow' ? 0x8e9aa8 : 0x2b3328;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 26, 52);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 120);

scene.add(new THREE.HemisphereLight(0xdfe8ff, THEME === 'snow' ? 0x6a7280 : 0x3a2c1e, THEME === 'snow' ? 1.35 : 1.6));
const sun = new THREE.DirectionalLight(0xfff0d8, THEME === 'snow' ? 2.0 : 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-16, right:16, top:16, bottom:-16, near:1, far:60});
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// toon gradient
const grad = new THREE.DataTexture(new Uint8Array([70,150,215,255]), 4, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, extra={}) => new THREE.MeshToonMaterial({color, gradientMap:grad, ...extra});

// ---------- ground ----------
function groundTex(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#5b5237'; g.fillRect(0,0,512,512);
  const cols = ['#4f4730','#665c3e','#544a2f','#6b6244','#47402b','#5e6a3a'];
  for (let i=0;i<900;i++){
    g.fillStyle = cols[i%cols.length]; g.globalAlpha = 0.18 + Math.random()*0.22;
    const x=Math.random()*512, y=Math.random()*512, r=4+Math.random()*26;
    g.beginPath(); g.ellipse(x,y,r,r*(0.5+Math.random()*0.6),Math.random()*3,0,7); g.fill();
  }
  g.globalAlpha = 0.35; g.fillStyle = '#d9cfb3';
  for (let i=0;i<40;i++){ g.fillRect(Math.random()*512, Math.random()*512, 2+Math.random()*5, 1.5); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(9,13);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 170), toon(0xffffff, {map:groundTex()}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; ground.userData.outlineParameters = {visible:false};
ground.position.z = -31;
scene.add(ground);

// ---------- props ----------
const BONE = 0xe6dcc0, WOOD = 0x6d4a2c, DARK = 0x3a2a1c;
function add(mesh, x, y, z, ry=0){ mesh.position.set(x,y,z); mesh.rotation.y = ry; mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); return mesh; }
const flat = m => { m.userData.outlineParameters = {visible:false}; return m; };
function plane(w, d, color, x, z, y=0.01){ const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), toon(color)); m.rotation.x = -Math.PI/2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(flat(m)); return m; }
// merge many transformed copies of one geometry into a single mesh (cheap to draw and outline)
function merged(geo, mats4, color){ const gs = mats4.map(m => geo.clone().applyMatrix4(m)); const g = mergeGeometries(gs); const mesh = new THREE.Mesh(g, toon(color)); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); return mesh; }
const M4 = (x, y, z, ry=0, rz=0, sy=1) => new THREE.Matrix4().compose(new THREE.Vector3(x,y,z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, rz)), new THREE.Vector3(1, sy, 1));
// canvas text for signs and the clock
function textTex(lines, w=256, h=128, bg='#c9a25e', fg='#2a1c10'){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0,0,w,h); g.strokeStyle = '#2a1c10'; g.lineWidth = 8; g.strokeRect(4,4,w-8,h-8);
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((t, i) => { g.font = `900 ${i===0 ? 40 : 30}px system-ui`; g.fillText(t, w/2, h*(lines.length===1 ? 0.5 : 0.32 + i*0.38)); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function sign(lines, x, z, ry=0, wide=1.3){
  const g = new THREE.Group();
  const board = new THREE.Mesh(new THREE.BoxGeometry(wide, wide*0.5, 0.05), [toon(WOOD),toon(WOOD),toon(WOOD),toon(WOOD), new THREE.MeshBasicMaterial({map:textTex(lines)}), toon(WOOD)]);
  board.position.y = 1.05; g.add(board);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,1.05,6), toon(WOOD)); post.position.y = 0.5; g.add(post);
  g.traverse(o=>{ if(o.isMesh) o.castShadow = true; }); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); return g;
}

// ground: field roads to the north gates, town yard, internal roads
// snow: trampled slush roads and a packed-snow yard; mud: the original browns
const GC = THEME === 'snow' ? {field:0x8d8a84, yard:0xaeb6c0, road:0x8f8a82} : {field:0x6e6346, yard:0x5a4f35, road:0x766a4b};
for (const rx of ROADS) plane(1.7, 56.5, GC.field, rx, -18.25);   // the two field roads run from the north gates all the way to the outpost site
plane(20, 20, GC.yard, 0, 20, 0.008);
for (const rx of ROADS) plane(1.5, 20, GC.road, rx, 20, 0.012);
for (const rz of ROADZ) plane(20, 1.5, GC.road, 0, rz, 0.013);

// collision boxes (players): [x0, x1, z0, z1]
const SOLIDS = [];
const solid = (x0, x1, z0, z1) => SOLIDS.push([x0, x1, z0, z1]);

const FENCE_RUNS = [], FENCE_CODE = [];
// bone fence: low enough to shoot over (about half the squirrel's height), gaps at the 8 road gates
{
  const stakeGeo = new THREE.CapsuleGeometry(0.07, 0.5, 2, 6), knobGeo = new THREE.SphereGeometry(0.1, 7, 5);
  const railGeo = new THREE.CapsuleGeometry(0.05, 1.5, 2, 6); railGeo.rotateZ(Math.PI/2);
  const stakes = [], knobs = [], rails = [];
  const gap = (v, gates) => gates.some(g => Math.abs(v - g) < 0.85);
  const side = (horizontal, fixed, from, to, gates) => {
    for (let v = from; v <= to + 0.01; v += 0.34){
      if (gap(v, gates)) continue;

{
  const add = (cx, cz, horizontal, inward) => {
    const g = {x:cx, z:cz, open:0, want:0, lastNear:-99, leaves:[]};

function onWorldTap(x, y){

function buildGoal(){

  { const st = stg().steps[tut.step]; if (st && st.goal){ const g = st.goal(); if (g) return g; } }
  if (isKit(W.carrying)){

    const free = BUILD.lineTiles.filter(t => !t.done); if (!free.length) return null;
